# dockyard -- shared local backing services.
#
# Five services, all started by `dockyard up`: Postgres, Redis, SeaweedFS,
# Mailpit and Caddy. There is no optional tier and nothing to enable.
#
# Three rules govern this file.
#
# 1. Every published port is written 127.0.0.1:HOST:CONTAINER. Docker
#    programs packet filtering directly and a bare "HOST:CONTAINER" mapping
#    is reachable from the whole local network even when a host firewall is
#    running. These are credentialed databases with convenience passwords;
#    the loopback prefix is the control that keeps them local.
#
# 2. Every service has a healthcheck. `dockyard up` waits on them, so a
#    service without one reports ready before it can accept connections and
#    the first `project:add` after a cold start fails confusingly.
#
# 3. Every image tag comes from .env. The version a service runs is recorded
#    in one place, and an upgrade is a one-line change with a visible diff.
#
# Machine-specific changes belong in a compose.override.yml beside this file,
# which Docker Compose merges automatically and which is gitignored.

name: ${DOCKYARD_PROJECT:-dockyard}

x-restart: &restart
  restart: unless-stopped

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

networks:
  dockyard:
    # Named explicitly so a project's own compose file can join it with
    # `external: true` and reach services by hostname.
    name: ${DOCKYARD_NETWORK:-dockyard}
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  mailpit-data:
  caddy-data:

services:

  postgres:
    <<: *restart
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    networks: [dockyard]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockyard}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      # -U and -d are required: without them pg_isready probes a database
      # named after the container user, which does not exist, and the
      # service never reports healthy.
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]

  redis:
    <<: *restart
    image: redis:${REDIS_VERSION:-7-alpine}
    networks: [dockyard]
    # appendonly keeps per-project databases across a restart; without it a
    # `dockyard restart` silently empties every project's cache and queue.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --databases
      - "${REDIS_DATABASES:-16}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.48}
    networks: [dockyard]
    # `mini` runs master, volume, filer, S3 gateway and admin UI in one
    # process -- the single-node shape a local stack wants.
    command:
      - mini
      - -dir=/data
      - -master.telemetry=false
      - -admin.user=${SEAWEEDFS_ROOT_USER:-dockyard}
      - -admin.password=${SEAWEEDFS_ROOT_PASSWORD:-dockyard-root}
    environment:
      # Read on every start as the S3 admin identity. Without any identity
      # SeaweedFS serves S3 anonymously; with this one, unsigned requests are
      # refused and projects get scoped keys from `s3.configure`.
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ROOT_USER:-dockyard}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_ROOT_PASSWORD:-dockyard-root}
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "127.0.0.1:${SEAWEEDFS_ADMIN_PORT:-23646}:23646"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]

  mailpit:
    <<: *restart
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    networks: [dockyard]
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      # One shared inbox for every project, so accept whatever credentials a
      # project's mailer is configured with rather than making each project
      # match a single set.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Without this mailpit stores messages under /tmp inside the container,
      # so a restart empties the inbox -- the same trap the redis appendonly
      # flag above exists to avoid.
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  caddy:
    <<: *restart
    image: caddy:${CADDY_VERSION:-2-alpine}
    networks: [dockyard]
    # Routes <name>.localhost to apps. Upstreams are either a container on the
    # dockyard network by service name, or an app's published port through
    # host.docker.internal -- which this line makes resolvable on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The directory is mounted rather than the file: editors that save by
    # rename would otherwise leave the container reading the old inode. The
    # tracked example is the fallback, so a fresh clone starts without a
    # Caddyfile of its own.
    command:
      - sh
      - -c
      - |
        f=/etc/caddy/Caddyfile
        [ -f "$$f" ] || f=/etc/caddy/Caddyfile.example
        exec caddy run --config "$$f" --adapter caddyfile
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
    healthcheck:
      <<: *healthcheck
      # The admin API listens on the container's loopback only; it is never
      # published, and it is what `caddy reload` talks to.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
